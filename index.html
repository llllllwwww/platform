    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2356d9b1%22/%3E%3C/svg%3E"
    />

    <link rel="stylesheet" href="assets/evidence-link.css" />
    <link rel="stylesheet" href="assets/task-workspace.css" />
    <script defer src="assets/core.js"></script>
    <script defer src="assets/adapters.js"></script>
    <link rel="stylesheet" href="assets/video-workspace.css?v=20261008-session-6">
    <script defer src="assets/display-diagnostics.js?v=20261008-session-6"></script>
    <script defer src="assets/video-inference.js?v=20261008-session-6"></script>
    <script defer src="assets/video-monitor.js?v=20261008-session-6"></script>
    <script defer src="assets/radar-acquisition.js"></script>
    <script defer src="assets/evidence-core.js?v=20261008-session-6"></script>
    <script defer src="assets/position-review.js"></script>
    <script defer src="assets/evidence-link.js"></script>
    <script defer src="assets/video-reconstruction.js?v=20261008-session-6"></script>
    <script defer src="assets/video-workspace.js?v=20261008-session-6"></script>

    <script defer src="assets/app.js?v=20261008-session-6"></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#overview"
        ><span class="brand-mark">隧</span
        ><span
          ><strong>隧雷智检</strong><small>TUNNEL INTELLIGENCE</small></span
        ></a
      >
      <div class="workspace-label">工程工作空间 <span>V2.0</span></div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span> 本地工作台
        <small>视频成果保存在本机视频档案</small
        ><a href="平台使用说明.md" target="_blank">使用说明 ↗</a>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="project">
          <span class="status-dot"></span><b>示范隧道</b
          ><span class="muted">/</span><span>K3+128 — K3+176</span>
        </div>
        <div class="top-actions">
          <label for="batch">检测批次</label
          ><select id="batch" aria-label="检测批次"></select
          ><span class="badge mint" id="dataBadge">演示数据</span
          ><button class="icon-button" id="helpButton" aria-label="操作指引">
            ?
          </button>
        </div>
      </header>
      <section id="videoWorkspaceBar" aria-label="当前视频数据来源"></section>
      <main id="page" tabindex="-1"></main>
      <footer class="footer">
        <span>隧道智能检测与数字孪生平台</span
        ><span id="saveStatus">本地状态已就绪</span
        ><span id="frontendVersion">界面版本 2026.10.08.6</span
        ><span>检测 · 理解 · 评估 · 决策</span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <div id="modalContent"></div>
      <button
        class="dialog-close"
        data-action="close-modal"
        aria-label="关闭弹窗"
      >
        ×
      </button>
    </dialog>
    <noscript>请启用 JavaScript 后使用本地平台。</noscript>
  </body>
</html>
