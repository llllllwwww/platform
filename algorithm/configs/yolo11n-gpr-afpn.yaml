# GPR 病害检测模型：YOLO11n 主干 + AFPN 颈部（轻量版，适合 8GB 显存 / 边缘端）
# 文件名中的 yolo11n 不可改动，原因见 yolo11s-gpr-afpn.yaml 的说明。

nc: 2

scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  -> P3，实际 128 通道
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6  -> P4，实际 128 通道
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 -> P5，实际 256 通道

head:
  - [[4, 6, 10], 1, AFPN, [[128, 128, 256], 128, 3]] # 11
  - [11, 1, Index, [128, 0]] # 12 -> P3/8-small
  - [11, 1, Index, [128, 1]] # 13 -> P4/16-medium
  - [11, 1, Index, [128, 2]] # 14 -> P5/32-large
  - [[12, 13, 14], 1, Detect, [nc]] # 15 Detect(P3, P4, P5)