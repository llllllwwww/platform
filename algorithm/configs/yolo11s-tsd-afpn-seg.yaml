# 隧道表观病害分割模型：YOLO11s 主干 + AFPN 颈部 + Segment 头
# 用途：训练"伪标注器" —— 用带像素掩码的 TTD/CTCD 数据训练，再给 17338 张
#       真实隧道照片生成掩码，转成检测框后训练检测器。
# 文件名中的 yolo11s 不可改动：Ultralytics 靠文件名推断 scale，
# 而 AFPN 那一行写死的通道数（256/256/512）必须与 scale 推出的主干通道一致。

nc: 3 # crack / water / leaching，训练时由 data.yaml 覆盖

scales: # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  -> P3，实际 256 通道
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6  -> P4，实际 256 通道
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 -> P5，实际 512 通道

head:
  - [[4, 6, 10], 1, AFPN, [[256, 256, 512], 256, 3]] # 11
  - [11, 1, Index, [256, 0]] # 12 -> P3/8-small
  - [11, 1, Index, [256, 1]] # 13 -> P4/16-medium
  - [11, 1, Index, [256, 2]] # 14 -> P5/32-large
  - [[12, 13, 14], 1, Segment, [nc, 32, 256]] # 15 Segment(P3, P4, P5)