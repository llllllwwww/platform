# 隧道表观病害检测模型：YOLO11s 主干 + AFPN 颈部
# 数据：17338 张真实隧道衬砌照片，框由 AFPN-Seg 伪标注器生成
# 文件名中的 yolo11s 不可改动，原因见 yolo11s-tsd-afpn-seg.yaml 的说明。

nc: 3 # crack / water / leaching，训练时由 data.yaml 覆盖

scales: # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4  -> P3，实际 256 通道
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6  -> P4，实际 256 通道
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 -> P5，实际 512 通道

head:
  - [[4, 6, 10], 1, AFPN, [[256, 256, 512], 256, 3]] # 11
  - [11, 1, Index, [256, 0]] # 12 -> P3/8-small
  - [11, 1, Index, [256, 1]] # 13 -> P4/16-medium
  - [11, 1, Index, [256, 2]] # 14 -> P5/32-large
  - [[12, 13, 14], 1, Detect, [nc]] # 15 Detect(P3, P4, P5)