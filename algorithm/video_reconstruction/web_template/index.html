<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隧道影像三维复核</title><link rel="stylesheet" href="viewer.css"></head>
<body>
<header><div><span class="eyebrow">VIDEO → GEOMETRY → INSPECTION</span><h1>隧道影像三维复核</h1></div><div class="headline"><span id="sourceTitle"></span><b id="scaleTag">相对尺度</b></div></header>
<main><section class="scene-panel"><div class="toolbar" id="surfaceControls"><div><button id="regularized" class="active">规则化表面</button><button id="raw">原始重建</button></div><label><input id="showInferred" type="checkbox">标出补全区域</label><label><input id="showCaps" type="checkbox">封闭端盖</label><span id="surfaceNote"></span></div><div class="toolbar"><div><button id="overview" class="active">观察模型</button><button id="follow">当前帧视角</button><button id="focus">聚焦候选</button></div><label><input id="showMarkers" type="checkbox" checked>候选位置</label><label><input id="showPath" type="checkbox" checked>拍摄轨迹</label><label><input id="showTexture" type="checkbox" checked>纹理</label></div>
<div id="viewport"><canvas id="scene"></canvas><div class="scene-caption"><b id="modeName">视频恢复的真实表面</b><span>拖动旋转 · 滚轮缩放 · 右键拖动平移</span></div><div id="stats" class="stats"></div><div id="loading">正在载入三维表面…</div></div>
<div class="timeline"><button id="prev" aria-label="上一帧">←</button><input id="time" type="range" min="0" value="0" aria-label="重建帧"><button id="next" aria-label="下一帧">→</button><span id="timeLabel"></span></div>
<div class="footnote" id="limits"></div></section>
<aside><section class="evidence"><div class="section-title"><h2>同帧影像证据</h2><label><input id="showMask" type="checkbox" checked>分割掩码</label></div><div id="evidenceBox"><img id="frameImage" alt="当前重建帧"><img id="maskImage" alt="裂缝模型候选掩码"><canvas id="evidenceCanvas"></canvas></div><div id="frameLabel" class="muted"></div><details><summary>查看原始录像</summary><video id="video" controls preload="metadata"></video><small>播放录像会同步到最近的重建帧。</small></details></section>
<section class="candidates"><div class="section-title"><h2>当前帧候选</h2><span id="candidateCount"></span></div><label class="filter">模型分数 ≥ <input id="confidence" type="range" min="0.5" max="0.99" value="0.7" step="0.01"><span id="confidenceLabel">0.70</span></label><label class="filter"><input id="repeatOnly" type="checkbox">仅看有多帧证据的候选</label><div id="candidateList"></div></section>
<section id="detail"><h2>位置与核验状态</h2><p id="selection">从列表或三维红色点簇中选择候选。</p><div id="relatedViews" class="related-views"></div></section><footer><div>红色表示模型候选，尚未确认病害。</div><div id="attribution"></div></footer></aside></main>
<script src="scene_data.js"></script><script src="viewer.js"></script></body></html>
